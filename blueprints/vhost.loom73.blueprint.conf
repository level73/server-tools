# @site_url@ — Loom73
<VirtualHost *:80>

    ServerAdmin webmaster@level73

    ServerName @site_url@
    @server_alias@

    RewriteEngine On

    DocumentRoot "@site_public_root@"

    ErrorLog "${APACHE_LOG_DIR}/@site_url@-error.log"
    CustomLog "${APACHE_LOG_DIR}/@site_url@-access.log" combined

    <Directory "@site_public_root@">
        Options -Indexes -MultiViews +SymLinksIfOwnerMatch
        AllowOverride FileInfo Indexes
        Require all granted

        DirectoryIndex index.php

        <FilesMatch "\.php$">
            SetHandler "proxy:unix:@php_socket@|fcgi://localhost/"
        </FilesMatch>
    </Directory>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

</VirtualHost>